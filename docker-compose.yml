services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      # Host port; set CLINIC_DB_PORT if 5433 is taken (and change the URLs in .env.local to match).
      - "${CLINIC_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - clinic-db:/var/lib/postgresql/data

volumes:
  clinic-db:
