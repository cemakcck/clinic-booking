name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://clinic:clinic@localhost:5433/clinic
      # The integration global setup creates and migrates clinic_test, clinic_e2e and clinic_e2e_live.
      TEST_DATABASE_URL: postgres://clinic:clinic@localhost:5433/clinic_test
      # Test-only values; the Playwright servers get their own in playwright.config.ts.
      BETTER_AUTH_SECRET: ci-auth-secret-ci-auth-secret-0123456
      DEMO_PASSWORD: demo-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
