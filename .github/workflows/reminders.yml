name: Reminders

on:
  schedule:
    # GitHub may delay scheduled runs, and disables them after 60 days without repository activity.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run the reminder pass
        run: |
          if [ -z "$REMINDERS_URL" ]; then
            echo "::notice::REMINDERS_URL is not set; skipping."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$REMINDERS_URL"
